services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-app
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      # Allows the container to access services running directly on the host (like Ollama)
      - "host.docker.internal:host-gateway"
    ports:
      # Keep this if you plan to run FastAPI or a web UI later on port 8000
      - "8000:8000"
    stdin_open: true
    tty: true